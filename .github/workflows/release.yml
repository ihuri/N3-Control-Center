name: Release Multiplataforma (macOS, Windows, Linux)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de incremento manual de versão (deixe auto para seguir Conventional Commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    name: 🏷️ Calcular Próxima Versão (SemVer)
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.version }}
      tag_name: ${{ steps.semver.outputs.version_tag }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versão SemVer a partir dos commits
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:|!:"
          minor_pattern: "feat:|feat\\("
          patch_pattern: "fix:|fix\\(|perf:|refactor:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Verificar se há nova versão para publicar
        id: check_release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" != "auto" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.semver.outputs.changed }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Versão calculada: ${{ steps.semver.outputs.version }}"
          echo "Tag: ${{ steps.semver.outputs.version_tag }}"

  build:
    name: 📦 Compilar para ${{ matrix.target_name }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_name: macOS (DMG & ZIP)
            builder_flag: --mac
          - os: windows-latest
            target_name: Windows (EXE & Portable)
            builder_flag: --win
          - os: ubuntu-latest
            target_name: Linux (AppImage & DEB)
            builder_flag: --linux

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev libarchive-tools
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Injetar versão SemVer no package.json
        run: |
          npm version ${{ needs.version.outputs.new_version }} --no-git-tag-version --allow-same-version

      - name: Instalar dependências npm
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar interface Vite
        run: npm run build

      - name: Gerar pacotes executáveis com electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder ${{ matrix.builder_flag }} --publish never

      - name: Fazer upload dos artefatos compilados
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: 🚀 Publicar Release no GitHub
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar todos os executáveis compilados
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Criar Git Tag e GitHub Release com binários
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: "Release ${{ needs.version.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.exe
            dist-release/*.AppImage
            dist-release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
